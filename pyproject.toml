[project]
name = "smpsave"
version = "0.3.1"
authors = [
    {name = "tbeeck", email = "becktimd@gmail.com"},
]
description = "Tool for provisioning private game servers on demand"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
	"License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
	"Development Status :: 2 - Pre-Alpha",
 	"Intended Audience :: Developers",
	"Intended Audience :: System Administrators",
	"Topic :: Games/Entertainment",
	"Topic :: Utilities",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",   
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]

requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.3.2",
	"linode_api4>=5.12.1",
	"click>=8.1.7",
    'importlib-metadata; python_version<"3.10"',
]

[project.urls]
homepage = "https://github.com/tbeeck/smpsave/"
documentation = "https://www.timbeck.me/smpsave/"

[project.scripts]
smpsave-cli = "smpsave.cli:run_cli"

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pytest>=8.4.2",
    "ruff>=0.16.0",
    {include-group = "docs"},
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-click>=5.1.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smpsave*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
