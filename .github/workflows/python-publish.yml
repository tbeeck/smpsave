# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: PyPI Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Check release tag matches project version
      run: |
        project_version="$(uv version --short --color never)"
        tag_version="${GITHUB_REF_NAME#v}"
        if [ "$project_version" != "$tag_version" ]; then
          echo "::error::Release tag '$GITHUB_REF_NAME' does not match the pyproject.toml version '$project_version'. Run 'uv version --bump <major|minor|patch>', commit, and re-tag."
          exit 1
        fi
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
